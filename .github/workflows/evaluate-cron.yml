name: Evaluacion de Riesgo Climatico (Cron cada 3h)

on:
  schedule:
    # Se ejecuta cada 3 horas (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  # Permite ejecutarlo manualmente desde GitHub cuando quieras
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Ejecutar Motor de Evaluación
        run: node scripts/evaluate.js

      - name: 4. Guardar y Publicar Datos Actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest-risk.json public/data/latest-risk.json data/history.json
          git diff --staged --quiet || (git commit -m "Auto-evaluación meteorológica [Cáritas Cron]" && git push)
name: Evaluacion y Verificacion SatRC (Cron cada 3h)

on:
  schedule:
    - cron: '17 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:

concurrency:
  group: satrc-pipeline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-evaluation-and-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Instalar dependencias
        run: npm install

      - name: 4. Ejecutar Motor de Pronóstico Acoplado
        run: node scripts/evaluate.js

      - name: 5. Ejecutar Robot de Verificación Continua
        run: node scripts/verify-forecast.js

      - name: 6. Despachar Alertas por Correo (Nivel 3 y 4)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_DESTINATION: ${{ secrets.ALERT_DESTINATION }}
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
        run: node scripts/send-alerts.js

      - name: 7. Publicar Datos y Estados en Repositorio
        run: |
          git config --global user.name "SatRC-Bot"
          git config --global user.email "satrc-bot@caritas.org"
          git add -A data/ public/data/
          git pull --rebase --autostash origin main
          git diff --staged --quiet || (git commit -m "Auto-evaluación meteorológica SatRC [Cron]" && git push origin main)

      - name: 8. Notificación en Caso de Fallo
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_DESTINATION: ${{ secrets.ALERT_DESTINATION }}
        run: |
          node -e '
            import("nodemailer").then(async ({ default: nodemailer }) => {
              const transporter = nodemailer.createTransport({
                host: "smtp.gmail.com", port: 587, secure: false,
                auth: { user: process.env.SMTP_USER, pass: process.env.SMTP_PASS },
                tls: { rejectUnauthorized: false }, family: 4
              });
              await transporter.sendMail({
                from: "\"SatRC Sentry\" <" + process.env.SMTP_USER + ">",
                to: process.env.ALERT_DESTINATION || "antoniogmadrigal@gmail.com",
                subject: "⚠️ [SatRC ALERTA SISTEMA] Fallo en la Ejecución Automática del Cron",
                text: "El workflow de evaluación de SatRC v1.0 en GitHub Actions ha fallado. Verifique la consola de Actions en GitHub."
              });
            }).catch(e => console.error(e));
          '
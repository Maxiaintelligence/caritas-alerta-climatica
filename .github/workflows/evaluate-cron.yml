name: Evaluacion y Verificacion SatRC (Cron cada 3h)

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-evaluation-and-verification:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Ejecutar Motor de Pronóstico Acoplado
        run: node scripts/evaluate.js

      - name: 4. Ejecutar Robot de Verificación Continua
        run: node scripts/verify-forecast.js

      - name: 5. Publicar Datos y Métricas Científicas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          git diff --staged --quiet || (git commit -m "Auto-evaluación y auditoría SatRC Bot [Cron]" && git push)
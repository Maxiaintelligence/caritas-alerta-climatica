name: Evaluacion y Verificacion SatRC (Cron cada 3h)

on:
  schedule:
    - cron: '17 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:

concurrency:
  group: satrc-pipeline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-evaluation-and-verification:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Instalar dependencias
        run: npm install --no-audit --prefer-offline

      - name: 4. Ejecutar Motor de Pronóstico Acoplado
        run: node scripts/evaluate.js

      - name: 5. Ejecutar Robot de Verificación Continua
        run: node scripts/verify-forecast.js

      - name: 6. Despachar Alertas por Correo (Nivel 3 y 4)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_DESTINATION: ${{ secrets.ALERT_DESTINATION }}
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
        run: node scripts/send-alerts.js

      - name: 7. Publicar Datos y Estados en Repositorio (Con Rebase Automático)
        run: |
          git config --global user.name "SatRC-Bot"
          git config --global user.email "satrc-bot@caritas.org"
          git add -A data/ public/data/
          git pull --rebase origin main || true
          git diff --staged --quiet || (git commit -m "Auto-evaluación meteorológica SatRC [Cron]" && git push origin main)